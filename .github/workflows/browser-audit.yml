name: MTDM AI Lab Browser Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mtdm-browser-audit
  cancel-in-progress: false

jobs:
  chromium-e2e:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project and browser-test dependencies
        run: npm install
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Wait for GitHub Pages deployment
        env:
          BASE_URL: https://aiagent16051987.github.io/MTDM-AI-Lab/
        run: |
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error "$BASE_URL" -o /tmp/mtdm-home.html; then
              if grep -q "MTDM AI Lab" /tmp/mtdm-home.html; then
                echo "GitHub Pages is responding."
                exit 0
              fi
            fi
            echo "Pages not ready (attempt $attempt/18); waiting 10 seconds."
            sleep 10
          done
          echo "GitHub Pages did not become ready in time."
          exit 1
      - name: Run deployed-site browser audit
        env:
          MTDM_BASE_URL: https://aiagent16051987.github.io/MTDM-AI-Lab/
          CI: true
        run: npm run test:e2e
      - name: Upload browser audit report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mtdm-browser-audit-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
