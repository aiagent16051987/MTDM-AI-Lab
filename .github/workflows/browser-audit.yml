name: MTDM AI Lab Browser Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mtdm-browser-audit
  cancel-in-progress: false

jobs:
  chromium-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project and browser-test dependencies
        run: npm install
      - name: Generate temporary dependency lock for audit
        run: npm install --package-lock-only --ignore-scripts
      - name: Audit resolved dependencies
        run: npm audit --audit-level=high
      - name: Run unit and integration tests
        run: npm test
      - name: Build production site
        run: npm run build
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run production-build browser audit
        env:
          CI: true
        run: npm run test:e2e
      - name: Upload browser audit report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mtdm-browser-audit-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
