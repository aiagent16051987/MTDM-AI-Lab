name: MTDM Autonomous Maintenance
on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"
permissions: {}
concurrency:
  group: mtdm-autonomous-maintenance
  cancel-in-progress: false
jobs:
  trial-gate:
    if: github.repository == 'aiagent16051987/MTDM-AI-Lab'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    outputs:
      active: ${{ steps.gate.outputs.active }}
    steps:
      - name: Enforce 48-hour trial window and self-disable after expiry
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          TRIAL_END_EPOCH: "1795877471"
        run: |
          now="$(date -u +%s)"
          if [ "$now" -lt "$TRIAL_END_EPOCH" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            echo "48-hour autonomous trial is active."
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Trial window expired; disabling this scheduled workflow."
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/autonomous-maintenance.yml/disable"
          fi

  inspect-repair-and-propose:
    needs: trial-gate
    if: needs.trial-gate.outputs.active == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install --ignore-scripts --no-package-lock
      - name: Run bounded autonomous maintenance
        run: node scripts/run-autonomous-maintenance.mjs
      - name: Upload maintenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mtdm-autonomous-maintenance-${{ github.run_number }}
          path: artifacts/autonomous-maintenance/report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Create review-only pull request for validated repairs
        if: success()
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/validated-maintenance
          delete-branch: false
          add-paths: |
            scripts/
            evolution-engine/
            research-engine/
            generated-simulations/
            app.js
            advanced-labs.js
            robotics-core.js
            nano-core.mjs
            printing-core.mjs
            printing-lab.mjs
            printing-lab.js
            research-labs.js
            research-next.js
            visual-circuit.js
            navigation.js
          commit-message: "Apply validated autonomous maintenance repairs"
          title: "Automated maintenance: validated repair proposal"
          body: |
            ## Automated maintenance proposal

            This PR was produced by the bounded MTDM remediation engine.

            - Only maintainer-authored, enabled, exact-match recipes can edit files.
            - Full project tests and production build must pass before a PR is opened.
            - Failed validation rolls back every automated edit.
            - Workflow files, dependencies, capability claims, engineering safety rules, main-branch merge and production deployment are outside autonomous permissions.

            Review the maintenance report and inspect every changed line before merging.
