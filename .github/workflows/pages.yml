name: Deploy MTDM AI Lab Studio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mtdm-ai-lab-studio-deploy
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Generate temporary dependency lock for audit
        run: npm install --package-lock-only --ignore-scripts
      - name: Audit resolved dependencies
        run: npm audit --audit-level=high
      - name: Run deterministic engineering and governance tests
        run: npm test
      - name: Build production site
        run: npm run build
      - name: Verify Vite emitted bundled application assets
        run: |
          test -s dist/index.html
          grep -Eq 'assets/[^"]+\.js' dist/index.html
          if grep -Eq 'src="[^"]*app\.js' dist/index.html; then
            echo "Unbundled application entrypoint found in production HTML."
            exit 1
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  browser-audit:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Generate temporary dependency lock for audit
        run: npm install --package-lock-only --ignore-scripts
      - name: Audit resolved dependencies
        run: npm audit --audit-level=high
      - name: Run deterministic engineering and governance tests
        run: npm test
      - name: Build exact commit for browser audit
        run: npm run build
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run browser audit against local production build
        env:
          CI: true
        run: npm run test:e2e
      - name: Upload browser audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mtdm-browser-audit-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
  deploy:
    needs: [build, browser-audit]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy validated Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
  verify-live:
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - name: Verify deployed production entrypoint and bundled JavaScript
        env:
          BASE_URL: https://aiagent16051987.github.io/MTDM-AI-Lab/
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$BASE_URL" -o /tmp/mtdm-index.html
          ASSET=$(grep -oE 'src="[^"]*assets/[^"]+\.js"' /tmp/mtdm-index.html | head -n 1 | cut -d '"' -f 2)
          test -n "$ASSET"
          case "$ASSET" in
            http*) ASSET_URL="$ASSET" ;;
            /*) ASSET_URL="https://aiagent16051987.github.io$ASSET" ;;
            *) ASSET_URL="${BASE_URL%/}/$ASSET" ;;
          esac
          curl --fail --silent --show-error "$ASSET_URL" -o /tmp/mtdm-app.js
          if grep -Eq '(from|import)[[:space:]]*["\x27]@spice-ts/core' /tmp/mtdm-app.js; then
            echo "Bare package import leaked into deployed browser JavaScript."
            exit 1
          fi
          echo "Live Pages entrypoint and bundled application asset verified."
