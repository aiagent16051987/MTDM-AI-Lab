name: Deploy MTDM AI Lab Studio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mtdm-ai-lab-studio-deploy
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Test SPICE engine
        run: npm test
      - name: Build site
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  browser-audit:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Wait for deployed GitHub Pages
        env:
          BASE_URL: https://aiagent16051987.github.io/MTDM-AI-Lab/
        run: |
          for attempt in $(seq 1 18); do
            if curl --fail --silent "$BASE_URL" -o /tmp/mtdm-home.html && grep -q "MTDM AI Lab" /tmp/mtdm-home.html; then
              echo "GitHub Pages is responding."
              exit 0
            fi
            echo "Pages not ready (attempt $attempt/18); waiting 10 seconds."
            sleep 10
          done
          echo "GitHub Pages did not become ready in time."
          exit 1
      - name: Run Chromium functional audit
        env:
          MTDM_BASE_URL: https://aiagent16051987.github.io/MTDM-AI-Lab/
          CI: true
        run: npm run test:e2e
      - name: Upload browser audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mtdm-browser-audit-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
