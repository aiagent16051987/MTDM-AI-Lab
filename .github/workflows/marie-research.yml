name: MARIE Autonomous Research Monitor
on:
  push:
    branches: [feature/marie-research-invention-engine]
  pull_request:
    paths:
      - 'research-engine/**'
      - 'scripts/marie-test.mjs'
      - 'scripts/run-marie.mjs'
      - 'package.json'
      - '.github/workflows/marie-research.yml'
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 1"
permissions:
  contents: read
concurrency:
  group: mtdm-marie-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install
      - name: Generate dependency lock and audit resolved packages
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit --audit-level=high
      - name: Run MARIE deterministic tests
        run: npm run marie:test
      - name: Run read-only research monitor
        run: npm run marie:run
      - name: Upload research reports
        uses: actions/upload-artifact@v4
        with:
          name: marie-research-${{ github.run_number }}
          path: artifacts/marie/
          if-no-files-found: error
          retention-days: 30
